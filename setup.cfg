[metadata]
name = PyPDF2

author = Mathieu Fenniak
author_email = 3604266+bzielinski@users.noreply.github.com
maintainer = Martin Thoma
maintainer_email = 53424347+htoma@users.noreply.github.com

description = PDF toolkit
long_description = file: README.md

url = https://mstamy2.github.io/PyPDF2
project_urls =
    Source = https://github.com/mstamy2/PyPDF2
    Bug Reports = https://github.com/mstamy2/PyPDF2/issues
